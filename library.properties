sentence=Display + XPT2046 resistive-touch driver for the resistive "Cheap Yellow Display" boards: ESP32-2432S028 and ESP32-32E 2.8", 3.2", 3.5", 4.0", auto-detected
paragraph=Self-contained display and resistive-touch driver for the ESP32 "Cheap Yellow Display" family with XPT2046 touch: the original ESP32-2432S028, and the generic ESP32-32E boards whose PCB silkscreen reads e.g. "2.8" LCD Display / ESP32-32E 240x320 / Resistance Touch", in 2.8", 3.2" (240x320), 3.5" and 4.0" (320x480) sizes (sold by several vendors). At start-up it detects the board's wiring (backlight pin, and whether touch has its own pins or shares the display bus), the panel controller (ILI9341, ST7789 or ST7796, 240x320 or 320x480), and which GPIO the red LED is on. It drives the panel through the ESP-IDF SPI master driver. Ships LVGL 9.3 examples with display, touch and LVGL plumbing already wired up: a hand-written Claude Code stub, a SquareLine Studio launcher, bouncing-balls and calculator demos, an MP3 player that plays from the TF card through the on-board speaker, and a touch calibration tool. Capacitive-touch CYDs are not supported.
category=Display
