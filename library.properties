sentence=Display + XPT2046 resistive-touch driver for the resistive "Cheap Yellow Display" boards: ESP32-2432S028, ESP32-32E 2.8", 3.2", 3.5", 4.0", ESP32-024 2.4", ESP32-035 3.5" and ESP32-2432S032 3.2" (also its capacitive -C), plus the capacitive ESP32-2432S024C, JC2432W328 and ESP32-3248S035C, auto-detected
paragraph=Self-contained display and resistive-touch driver for the ESP32 "Cheap Yellow Display" family with XPT2046 touch: the original ESP32-2432S028, and the generic ESP32-32E boards whose PCB silkscreen reads e.g. "2.8" LCD Display / ESP32-32E 240x320 / Resistance Touch", in 2.8", 3.2" (240x320), 3.5" and 4.0" (320x480) sizes (sold by several vendors); the 2.4" ESP32-024 (sold as ESP32-2432S024), the 3.5" ESP32-035, and the 3.2" ESP32-2432S032 together with its capacitive twin, the ESP32-2432S032C, whose GT911 touch is supported too; two capacitive boards with CST820 touch, the 2.4" ESP32-2432S024C and the 2.8" Guition JC2432W328; and the 3.5" ESP32-3248S035C with GT911 touch. At start-up it detects the board's wiring (backlight pin, and whether touch has its own pins or shares the display bus), the panel controller (ILI9341, ST7789 or ST7796, 240x320 or 320x480), which GPIO the red LED is on, and any capacitive touch chip (GT911 or CST820) on I2C, and from those names the board. Per-board overrides saved by the touch calibration tool can name the model or screen size outright (e.g. a 32E 3.5" vs 4.0") or correct individual settings. It drives the panel through the ESP-IDF SPI master driver. Two ways to use the screen: LVGL 9, or a console-style text terminal (print / printf, no LVGL, ~5 KB RAM) that scrolls with the panel's hardware vertical scrolling, with UTF-8, colors, a blinking cursor, frozen header / footer areas, touch in character cells, LVGL's symbol set and opt-in Chinese / Japanese / Korean fonts. Ships LVGL 9.3 examples with display, touch and LVGL plumbing already wired up: a hand-written Claude Code stub, a SquareLine Studio launcher, bouncing-balls and calculator demos, an MP3 player that plays from the TF card through the on-board speaker, and a touch calibration tool, plus text-terminal examples. Other capacitive-touch CYDs get working touch if their chip is a GT911 or CST820 on SDA 33 / SCL 32, but are not named.
